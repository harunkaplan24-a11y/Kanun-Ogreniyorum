name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK directly from project files
        run: gradle --no-daemon assembleDebug

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Kanun Öğreniyorum - Son APK
          body: Otomatik oluşturulmuş Android APK. İndirmek için Kanun-Ogreniyorum-debug.apk dosyasını seçin.
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: true
